name: Build Studio tests

on:
  push:
    branches:
      - main
      - feature/build-studio-gui
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install GUI package
        run: python -m pip install -e ".[gui]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Smoke-test build driver environment report
        run: python build.py doctor --json
      - name: Check native launcher C syntax
        if: runner.os != 'Windows'
        run: cc -D_GNU_SOURCE -std=c11 -fsyntax-only -Isrc src/jorek_suite.c
      - name: Launch GUI smoke test
        run: python -c "from PySide6.QtWidgets import QApplication; from jorek_build_studio.main_window import MainWindow; app = QApplication([]); window = MainWindow(); assert window.tabs.count() == 8; window.deleteLater()"
      - name: Test application entry point
        run: python -m jorek_build_studio --smoke-test
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build --outdir "${{ github.workspace }}/dist" "${{ github.workspace }}"
        working-directory: ${{ runner.temp }}
      - name: Install the built wheel
        run: python -c "import glob, subprocess, sys; files = glob.glob('dist/*.whl'); assert files; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *files])"
      - name: Smoke-test installed wheel entry point
        run: python -I -m jorek_build_studio --smoke-test

  python-compat:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12", "3.13"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI package without GUI extras
        run: python -m pip install -e .
      - name: Run cross-version unit and integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  jorek-source-integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch pinned JOREK source checkout
        run: |
          mkdir -p /tmp/jorek-base
          git -C /tmp/jorek-base init
          git -C /tmp/jorek-base remote add origin https://github.com/iterorganization/JOREK.git
          git -C /tmp/jorek-base fetch --depth 1 origin aa47fd30274c96cf9828fcc5a42d4d0bcc7df7b9
          git -C /tmp/jorek-base checkout --detach FETCH_HEAD
      - name: Install CLI package
        run: python -m pip install -e .
      - name: Install OpenSSH server and native Fortran compiler
        run: sudo apt-get update && sudo apt-get install -y openssh-server gfortran
      - name: Start local OpenSSH integration endpoint
        run: |
          sudo useradd --create-home --shell /bin/bash sshbuild
          printf 'sshbuild:temporary-ssh-only\n' | sudo chpasswd
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/jorek-ssh-test"
          sudo install -d -m 700 -o sshbuild -g sshbuild /home/sshbuild/.ssh
          sudo install -m 600 -o sshbuild -g sshbuild "$RUNNER_TEMP/jorek-ssh-test.pub" /home/sshbuild/.ssh/authorized_keys
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -D -p 2222 -o ListenAddress=127.0.0.1 -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o PermitRootLogin=no -o PubkeyAuthentication=yes -o AllowUsers=sshbuild > "$RUNNER_TEMP/sshd.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if ssh-keyscan -p 2222 127.0.0.1 >> "$HOME/.ssh/known_hosts" 2>/dev/null; then break; fi
            sleep 1
          done
          ssh -p 2222 -i "$RUNNER_TEMP/jorek-ssh-test" -o IdentitiesOnly=yes -o BatchMode=yes sshbuild@127.0.0.1 true || { cat "$RUNNER_TEMP/sshd.log"; exit 1; }
          echo "JOREK_SSH_TEST_HOST=sshbuild@127.0.0.1" >> "$GITHUB_ENV"
          echo "JOREK_SSH_TEST_PORT=2222" >> "$GITHUB_ENV"
          echo "JOREK_SSH_TEST_KEY=$RUNNER_TEMP/jorek-ssh-test" >> "$GITHUB_ENV"
      - name: Run full test suite with real JOREK source and live SSH endpoint
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Generate a real JOREK model matrix
        run: |
          python build.py --root /tmp/jorek-base --work /tmp/jorek-work matrix --matrix maximal --json > /tmp/jorek-matrix.json
          python -c "import json; data = json.load(open('/tmp/jorek-matrix.json', encoding='utf-8')); assert data; print('Discovered %d native JOREK variants' % len(data))"
      - name: Dry-run a real JOREK model build
        run: python build.py --root /tmp/jorek-base --work /tmp/jorek-dry-run --dry-run --deps none build --model 303 --matrix one --programs main
