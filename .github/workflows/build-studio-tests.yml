name: Build Studio tests

on:
  push:
    branches:
      - main
      - feature/build-studio-gui
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install GUI package
        run: python -m pip install -e ".[gui]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Smoke-test build driver environment report
        run: python build.py doctor --json
      - name: Check native launcher C syntax
        if: runner.os != 'Windows'
        run: cc -D_GNU_SOURCE -std=c11 -fsyntax-only -Isrc src/jorek_suite.c
      - name: Launch GUI smoke test
        run: python -c "from PySide6.QtWidgets import QApplication; from jorek_build_studio.main_window import MainWindow; app = QApplication([]); window = MainWindow(); assert window.tabs.count() == 8; window.deleteLater()"
      - name: Test application entry point
        run: python -m jorek_build_studio --smoke-test

  python-compat:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12", "3.13"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI package without GUI extras
        run: python -m pip install -e .
      - name: Run cross-version unit and integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
