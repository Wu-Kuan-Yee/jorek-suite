[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jorek-build-studio"
version = "0.1.0"
description = "Minimal Qt desktop frontend for the JOREK suite builder"
readme = "docs/BUILD_STUDIO.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [{ name = "JOREK Build Studio contributors" }]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7"]

[project.scripts]
jorek-build-studio = "jorek_build_studio.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jorek_build_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
